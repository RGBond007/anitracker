# GitLab CI -- port of .github/workflows/ci.yml
#
# Runs on merge requests and on pushes to the default branch. The `workflow`
# block keeps a branch push that already has an open MR from producing two
# pipelines.

stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

backend:
  stage: test
  image: python:3.12
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files:
        - backend/pyproject.toml
    paths:
      - .cache/pip
  before_script:
    - cd backend
    - pip install -e ".[dev]"
  script:
    - ruff check .
    - ruff format --check .
    # The suite runs against recorded fixtures and in-memory SQLite -- no
    # network, no database service needed.
    - pytest -q

frontend:
  stage: test
  image: node:22
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .cache/npm
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint
    - npm run build

# Named docker-image rather than image: a top-level `image:` key is the reserved
# keyword that sets the default job image, so it cannot also be a job name.
docker-image:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker build -t anitrack:ci .

# GitLab Pages -- the GitHub side publishes docs/ directly from the default
# branch, but two things have to be reworked for GitLab.
#
# The demo is a Vite build with its base path compiled into the HTML, JS and CSS,
# and GitLab serves the site from a different path than GitHub does. So the demo
# is rebuilt here rather than copied, with the base taken from CI_PAGES_URL --
# that way it stays correct whether or not the project uses a unique domain.
#
# The landing page also hardcodes github.com links, which are rewritten to point
# at this project. Only the published copy is rewritten; docs/ in git is untouched.
pages:
  stage: deploy
  image: node:22
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .cache/npm
    policy: pull
  script:
    # CI_PAGES_URL is the full origin plus path, e.g. https://host/group/project
    # or https://project-hash.gitlab.io for a unique domain. Keep only the path,
    # which is "" at a domain root, and normalise it to a leading+trailing slash.
    - PAGES_PATH=$(printf '%s' "$CI_PAGES_URL" | sed -E 's#^[a-z]+://[^/]+##')
    - export DEMO_BASE="${PAGES_PATH%/}/demo/"
    - 'echo "Pages URL: $CI_PAGES_URL -- demo base: $DEMO_BASE"'
    - cd frontend && npm ci && npm run build:demo && cd ..
    - cp -r docs public
    # Rewrite the GitHub links. Both repository spellings appear in the committed
    # HTML, and GitLab's paths differ from GitHub's -- blobs and releases live
    # under /-/ and a release is addressed by tag directly -- so the file and
    # release forms are rewritten before the bare repository URL.
    - |
      REPO='https://github\.com/RGBond007/anitracker?'
      find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.webmanifest' \) \
        -exec sed -i -E \
          -e "s#${REPO}/releases/tag/#${CI_PROJECT_URL}/-/releases/#g" \
          -e "s#${REPO}/blob/#${CI_PROJECT_URL}/-/blob/#g" \
          -e "s#${REPO}#${CI_PROJECT_URL}#g" \
          {} +
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Same idea as the publish job in .github/workflows/ci.yml, aimed at GitLab's
# own container registry. Only version tags publish; branch pipelines keep the
# build-only check above.
publish:
  stage: deploy
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # arm64 is emulated here, so binfmt has to be registered before buildx can
    # run the arm64 stages. A large share of self-hosters are on ARM boards and
    # NAS units that cannot use an amd64-only image at all.
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name multiarch
    # CI_COMMIT_TAG is v2.1.0; publish 2.1.0, 2.1 and latest to match the
    # GitHub side so a compose file can track either registry the same way.
    - VERSION="${CI_COMMIT_TAG#v}"
    - MINOR="${VERSION%.*}"
    # One buildx invocation with --push: a multi-arch manifest cannot be built
    # locally and pushed afterwards the way a single-arch image can.
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        -t "$CI_REGISTRY_IMAGE:$VERSION" \
        -t "$CI_REGISTRY_IMAGE:$MINOR" \
        -t "$CI_REGISTRY_IMAGE:latest" \
        --push .
  rules:
    # Restricted to semver-shaped tags: the version arithmetic above assumes
    # X.Y.Z, so a tag like v-beta would push nonsense tags.
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
